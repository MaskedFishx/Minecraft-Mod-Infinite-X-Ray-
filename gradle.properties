org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# If your network cannot reach maven.neoforged.net from Java, configure an HTTP
# proxy through GRADLE_OPTS, for example:
#   GRADLE_OPTS="-Dhttps.proxyHost=<your-proxy-host> -Dhttps.proxyPort=<port>"

# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21
# Allow loading on 1.21.0 and 1.21.1
minecraft_version_range=[1.21,1.22)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.0.167
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties
mod_id=infinitexray
mod_name=Infinite X-Ray
mod_license=MIT
mod_version=1.0.1
mod_group_id=com.maskedfish.infinitexray
